<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=./googleadsimulater.html" />
  <title>AdLearn Pro</title>
  <style>
    :root {
      --bg1: #1a73e8;
      --bg2: #764ba2;
      --card: rgba(255,255,255,0.14);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.82);
      --border: rgba(255,255,255,0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 40px;
      max-width: 560px;
      width: min(90vw, 560px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.02em;
    }
    p {
      margin: 10px 0;
      color: var(--muted);
      font-size: 1rem;
    }
    a {
      color: var(--text);
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AdLearn Pro</h1>
    <p>Google Ads Demo Simulator</p>
    <p>Redirecting to the simulator...</p>
    <p><a href="./googleadsimulater.html">Open AdLearn Pro</a></p>
  </div>
</body>
</html>
